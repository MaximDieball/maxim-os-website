name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tickets:
    name: Ticketbezug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PR-Beschreibung enthält "Closes #<nr>"
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          scripts/check-ticket-ref.sh pr "$RUNNER_TEMP/pr-body.md"
      - name: Jeder Commit enthält "#<nr>"
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "Kein Vorgänger-Commit (neuer Branch), nichts zu prüfen."; exit 0
          fi
          scripts/check-ticket-ref.sh range "$BASE..$HEAD"

  pipeline:
    name: Lint, Typecheck, Vitest, Build, Playwright
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      DC: docker compose -f docker-compose.yml -f docker-compose.ci.yml
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Stellt ACTIONS_RUNTIME_TOKEN bereit, das der GHA-Cache von BuildKit braucht.
      - uses: crazy-max/ghaction-github-runtime@v3
      - name: Pipeline (make ci)
        run: make ci DC="$DC"
      - name: Playwright-Diffs hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: artifacts/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Container aufräumen
        if: always()
        run: make down DC="$DC"
