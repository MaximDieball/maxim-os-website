<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0b10" />
    <meta name="description" content="MAXIM OS – an ai coding project" />
    <title>MAXIM OS</title>
  </head>
  <body>
    <main id="app" class="app">
      <h1 class="sr-only">MAXIM OS Terminal</h1>
      <div id="term" class="term">
        <div id="suggestions" class="suggestions" role="group" aria-label="Vorschläge" hidden></div>
      </div>
      <form id="prompt" class="prompt" autocomplete="off" hidden>
        <input
          id="cmd"
          class="prompt-input"
          type="text"
          name="cmd"
          autocapitalize="off"
          autocorrect="off"
          autocomplete="off"
          spellcheck="false"
          enterkeyhint="send"
          inputmode="text"
          maxlength="256"
          aria-label="Command eingeben"
        />
      </form>
      <button
        id="scroll-down"
        class="scroll-down"
        type="button"
        aria-label="Nach unten scrollen"
        hidden
      >
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path
            d="M6 9l6 6 6-6"
            fill="none"
            stroke="currentColor"
            stroke-width="2.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
      <div id="quickkeys" class="quickkeys" role="toolbar" aria-label="Zusatztasten">
        <button type="button" data-key="tab" aria-label="Tab">Tab</button>
        <button type="button" data-key="up" aria-label="Vorheriger Command">↑</button>
        <button type="button" data-key="down" aria-label="Nächster Command">↓</button>
        <button type="button" data-key="ctrlc" aria-label="Abbrechen (Ctrl+C)">^C</button>
        <button type="button" data-insert="/">/</button>
        <button type="button" data-insert="~">~</button>
        <button type="button" data-insert="-">-</button>
      </div>
      <div id="live" class="sr-only" role="log" aria-live="polite"></div>
    </main>
    <canvas id="matrix" class="matrix" aria-hidden="true"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
