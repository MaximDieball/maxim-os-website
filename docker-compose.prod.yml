# Production (#38): nur die Website. Das LLM läuft separat (docker-compose.llm.yml oder ein
# eigener Stack, SPEC 4b); die Website hängt dafür im Netz des LLM.
#
#   cp .env.example .env            # Werte anpassen
#   make prod                       # bauen (mit Commit in /api/health) und starten
#   make prod-down / make prod-logs
#
# Der Tunnel (playit.gg) zeigt auf APP_BIND:APP_PORT (Standard 127.0.0.1:8080).
name: maxim-os-prod

services:
  website:
    image: ${APP_IMAGE:-maxim-os-app:latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      args:
        GIT_COMMIT: ${GIT_COMMIT:-dev}
    restart: unless-stopped
    ports:
      # Ein Port, standardmäßig nur lokal (der Tunnel-Agent läuft auf dem Host)
      - '${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:3000'
    environment:
      LLM_URL: ${LLM_URL-http://llm:8080}
      LLM_API_KEY: ${LLM_API_KEY:-}
      ASK_RATE_PER_CLIENT: ${ASK_RATE_PER_CLIENT:-10}
      ASK_RATE_GLOBAL: ${ASK_RATE_GLOBAL:-60}
      MINECRAFT_HOST: ${MINECRAFT_HOST-minecraft.maxim-dieball.de}
      MINECRAFT_PORT: ${MINECRAFT_PORT:-25565}
    volumes:
      # Inhalte read-only; der Snapshot entsteht beim Start (neue Inhalte = Neustart)
      - ${CONTENT_PATH:-./content}:/content:ro
    # Härtung (CLAUDE.md Regel 10, #37)
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: ${APP_MEM_LIMIT:-512m}
    cpus: ${APP_CPUS:-1}
    pids_limit: 200
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
      - default
      - llm

networks:
  # Netz des LLM-Containers (Alias "llm"). Mit docker-compose.llm.yml heißt es
  # maxim-os_llm-net. Ohne LLM einmal anlegen: docker network create --internal maxim-os_llm-net
  llm:
    name: ${LLM_NETWORK:-maxim-os_llm-net}
    external: true
